# Tag-triggered multi-OS release builds for HekaBrowser (repo: poretrace).
#
# Push a tag to publish a Release with prebuilt zips:
#   git tag v1.0.0 && git push origin v1.0.0
# Manual "Run workflow" only produces workflow artifacts (for testing builds
# before a release); the release job is gated on a tag ref.
#
# Matrix notes:
#   macos-latest   -> Apple Silicon (arm64); Intel dropped 2026-10: free-tier
#                     macos-13 queues exceeded 2h and the image is retiring
#   ubuntu-22.04   -> oldest glibc we support; runs on 22.04/24.04+
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   asset: poretrace-mac-arm64.zip }
          - { os: windows-latest, asset: poretrace-windows.zip }
          - { os: ubuntu-22.04,   asset: poretrace-linux.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyqt5 pyqtgraph numpy pyinstaller

      - name: Analysis smoke test (release gate)
        run: python test_analysis.py

      - name: PyInstaller
        run: python -m PyInstaller heka_browser.spec --noconfirm --clean

      - name: Package zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/poretrace.app "dist/${{ matrix.asset }}"

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -Command "Compress-Archive -Path 'dist\poretrace\*' -DestinationPath 'dist\${{ matrix.asset }}' -Force"

      - name: Package zip (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -qry "${{ matrix.asset }}" poretrace

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          generate_release_notes: true
          body: |
            **macOS**: unzip, then right-click ``poretrace.app`` -> *Open*
            (unsigned app). If macOS reports it as "damaged", run:
            ``xattr -cr /Applications/poretrace.app``
            安装：解压后右键 ``poretrace.app`` -> *打开*（未签名应用）；
            若提示"已损坏"，终端执行 ``xattr -cr /Applications/poretrace.app``

            **Windows**: SmartScreen may warn -> *"More info"* -> *"Run anyway"*.
            智能屏幕警告属正常 -> *"更多信息"* -> *"仍要运行"*。

            **Linux**: unzip, then ``chmod +x poretrace/poretrace && ./poretrace/poretrace``
